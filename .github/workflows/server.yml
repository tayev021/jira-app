name: Server Workflow
on:
  push:
    branches: [dev]
    paths:
      - 'server/**'
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: docker compose build
      - name: Lint Server
        run: docker compose run --rm server npm run lint
      - name: Start test database
        run: docker compose up -d mongo-test
      - name: Wait for test database
        run: |
          until [ "$(docker inspect -f '{{.State.Health.Status}}' mongo-test)" = "healthy" ]; do
            echo "Waiting for MongoDB..."
            sleep 2
          done
      - name: Run tests
        run: docker compose run --rm server npm run test
      - name: Cleanup
        if: always()
        run: docker compose down -v
