name: Server Workflow
on:
  push:
    branches: [dev]
    paths:
      - 'server/**'
jobs:
  server:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
