name: Main Workflow
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: docker compose build
      - name: Lint Client
        run: docker compose run --rm client npm run lint
      - name: Lint Server
        run: docker compose run --rm server npm run lint
      - name: Test Client
        run: docker compose run --rm client npm run test
      - name: Start test database
        run: docker compose up -d mongo-test
      - name: Wait for test database
        run: |
          timeout 120s bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" mongo-test)" = "healthy" ]; do
              echo "Waiting for MongoDB..."
              sleep 2
            done
          '
      - name: Test Server
        run: docker compose run --rm server npm run test
      - name: Cleanup
        if: always()
        run: docker compose down -v
